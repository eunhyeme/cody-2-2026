<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 티어리스트</title>
<style>
  :root {
    --bg: #141418;
    --panel: #1e1e24;
    --line: #2c2c35;
    --text: #ececf1;
    --muted: #9a9aa8;
    --accent: #ffcf5c;
    --card-h: 84px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* 상단 */
  header {
    height: 52px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .hint { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex: none; }
  button { font: inherit; cursor: pointer; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 14px;
  }
  .btn:hover { border-color: #55556a; }
  .btn.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 본문 */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 20px 14px;
  }
  #tiers {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .tier {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tier:last-child { border-bottom: none; }
  .label {
    width: 110px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 6px;
    color: #1a1a1a;
    font-weight: 800;
    font-size: 24px;
    text-align: center;
    word-break: keep-all;
    overflow: hidden;
    outline: none;
    cursor: text;
  }
  .label.long { font-size: 15px; }
  .label:focus { box-shadow: inset 0 0 0 3px #1a1a1a; }
  .zone {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    gap: 8px;
    padding: 6px 10px;
    transition: background 0.1s;
  }
  .zone.over { background: #2a2a34; }
  .del {
    width: 38px;
    flex: none;
    background: none;
    border: none;
    border-left: 1px solid var(--line);
    color: var(--muted);
    font-size: 18px;
  }
  .del:hover { color: #ff6b6b; background: #26262f; }

  .pool {
    flex: none;
    display: flex;
    border: 1px dashed #3a3a46;
    border-radius: 10px;
    background: #18181d;
  }
  .pool .label { color: var(--muted); font-size: 15px; cursor: default; }
  .pool .zone { min-height: calc(var(--card-h) + 14px); }
  .pool .empty { color: #5c5c6a; font-size: 13px; align-self: center; }

  /* 포스터풍 카드 */
  .card {
    position: relative;
    flex: none;
    width: calc(var(--card-h) * 0.68);
    height: var(--card-h);
    border-radius: 6px;
    overflow: hidden;
    background: var(--g);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: flex-end;
    padding: 5px;
    cursor: grab;
    transition: transform 0.12s;
  }
  .card:hover { transform: translateY(-2px); }
  .card::before {
    content: "";
    position: absolute;
    left: var(--cx);
    top: var(--cy);
    width: 72%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--a);
    opacity: 0.85;
    transform: translate(-50%, -50%);
  }
  .card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 60%;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
  }
  .card span {
    position: relative;
    z-index: 1;
    color: #fff;
    font-weight: 800;
    font-size: max(8px, calc(var(--card-h) * 0.12));
    line-height: 1.15;
    letter-spacing: -0.03em;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .card.dragging { opacity: 0.3; }
  .card.selected { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card.before { box-shadow: -6px 0 0 -2px var(--accent); }

  /* 클릭 이동 메뉴 */
  #menu {
    position: fixed;
    z-index: 20;
    display: none;
    min-width: 130px;
    padding: 4px;
    background: #2a2a33;
    border: 1px solid #3a3a46;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #menu .title { font-size: 12px; color: var(--muted); padding: 5px 10px 4px; }
  #menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 14px;
  }
  #menu button:hover { background: #3a3a46; }
  #menu button.current { color: var(--accent); }

  /* 마우스 올렸을 때 정보 */
  #tip {
    position: fixed;
    z-index: 30;
    display: none;
    pointer-events: none;
    padding: 8px 12px;
    background: #0c0c10;
    border: 1px solid #3a3a46;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.55;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  #tip b { display: block; font-size: 15px; }
  #tip .muted { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>영화 티어리스트</h1>
      <span class="hint">카드를 끌어다 놓거나 클릭해서 옮기세요 · 등급 이름은 클릭해서 수정</span>
    </div>
    <div class="actions">
      <button class="btn primary" id="addTier">+ 등급 추가</button>
      <button class="btn" id="reset">초기화</button>
    </div>
  </header>

  <main>
    <section id="tiers"></section>
    <section class="pool">
      <div class="label">미분류</div>
      <div class="zone" id="poolZone" data-zone="pool"></div>
    </section>
  </main>

  <div id="menu"></div>
  <div id="tip"></div>

<script>
  // ── 자료 ─────────────────────────────────────────────
  const MOVIES = [
    { id: "parasite",     title: "기생충",                 year: 2019, director: "봉준호",
      g: "linear-gradient(165deg,#44533f,#111510)", a: "#c9d3a9", cx: "72%", cy: "26%" },
    { id: "interstellar", title: "인터스텔라",             year: 2014, director: "크리스토퍼 놀란",
      g: "linear-gradient(180deg,#05070d,#1f2d4a)", a: "#e8d7a8", cx: "50%", cy: "34%" },
    { id: "lalaland",     title: "라라랜드",               year: 2016, director: "데이미언 셔젤",
      g: "linear-gradient(170deg,#3a2470,#1a3a7a)", a: "#ffd166", cx: "30%", cy: "24%" },
    { id: "spirited",     title: "센과 치히로의 행방불명", year: 2001, director: "미야자키 하야오",
      g: "linear-gradient(170deg,#b23a2e,#1f5f6b)", a: "#ffe7c2", cx: "66%", cy: "30%" },
    { id: "endgame",      title: "어벤져스: 엔드게임",     year: 2019, director: "안소니 루소 · 조 루소",
      g: "linear-gradient(170deg,#3a1240,#0b0b14)", a: "#e3b04b", cx: "50%", cy: "22%" },
    { id: "roundup",      title: "범죄도시",               year: 2017, director: "강윤성",
      g: "linear-gradient(170deg,#4a4a4a,#121212)", a: "#d62828", cx: "28%", cy: "32%" },
    { id: "titanic",      title: "타이타닉",               year: 1997, director: "제임스 카메론",
      g: "linear-gradient(180deg,#9cc0d6,#0f2a40)", a: "#f4f8fb", cx: "70%", cy: "20%" },
    { id: "toystory",     title: "토이 스토리",            year: 1995, director: "존 래시터",
      g: "linear-gradient(180deg,#3d97d6,#a7dcf7)", a: "#ffd23f", cx: "36%", cy: "30%" },
  ];
  const MOVIE = Object.fromEntries(MOVIES.map(m => [m.id, m]));
  const DEFAULT_TIERS = ["S", "A", "B", "C", "D"];
  const TIER_COLORS = ["#ff7f7f", "#ffbf7f", "#ffdf7f", "#bfff7f", "#7fbfff", "#bf9fff", "#ff9fdf", "#9fe8e0"];
  const MAX_TIERS = 8;
  const STORAGE_KEY = "movie-tierlist-v1";

  // ── 상태와 저장 ───────────────────────────────────────
  let seq = 0;
  const newId = () => "t" + Date.now().toString(36) + (seq++);

  function defaultState() {
    return {
      tiers: DEFAULT_TIERS.map(name => ({ id: newId(), name, items: [] })),
      pool: MOVIES.map(m => m.id),
    };
  }
  function isValid(s) {
    if (!s || !Array.isArray(s.tiers) || !Array.isArray(s.pool)) return false;
    const all = [...s.pool, ...s.tiers.flatMap(t => t.items || [])];
    return all.length === MOVIES.length && MOVIES.every(m => all.includes(m.id));
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (isValid(s)) return s;
    } catch (e) {}
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = load();

  // ── 동작 ──────────────────────────────────────────────
  function listOf(zoneId) {
    return zoneId === "pool" ? state.pool : state.tiers.find(t => t.id === zoneId).items;
  }
  function zoneOf(movieId) {
    if (state.pool.includes(movieId)) return "pool";
    return state.tiers.find(t => t.items.includes(movieId)).id;
  }
  function moveMovie(movieId, zoneId, index) {
    state.pool = state.pool.filter(id => id !== movieId);
    state.tiers.forEach(t => { t.items = t.items.filter(id => id !== movieId); });
    const list = listOf(zoneId);
    list.splice(Math.min(index, list.length), 0, movieId);
    save();
    render();
  }
  function addTier() {
    if (state.tiers.length >= MAX_TIERS) return;
    state.tiers.push({ id: newId(), name: "새 등급", items: [] });
    save();
    render();
    const labels = document.querySelectorAll("#tiers .label");
    const label = labels[labels.length - 1];
    label.focus();
    document.getSelection().selectAllChildren(label);
  }
  function deleteTier(tierId) {
    const tier = state.tiers.find(t => t.id === tierId);
    state.pool.push(...tier.items);
    state.tiers = state.tiers.filter(t => t.id !== tierId);
    save();
    render();
  }
  function resetAll() {
    if (!confirm("모든 배치와 등급을 처음 상태로 되돌릴까요?")) return;
    state = defaultState();
    save();
    render();
  }

  // ── 화면 그리기 ───────────────────────────────────────
  const $ = sel => document.querySelector(sel);
  function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

  function render() {
    closeMenu();
    hideTip();
    const tiersEl = $("#tiers");
    tiersEl.innerHTML = "";

    state.tiers.forEach((tier, i) => {
      const row = el("div", "tier");

      const label = el("div", "label" + (tier.name.length > 3 ? " long" : ""));
      label.textContent = tier.name;
      label.style.background = TIER_COLORS[i % TIER_COLORS.length];
      label.contentEditable = "true";
      label.spellcheck = false;
      label.title = "클릭해서 이름 변경";
      label.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); label.blur(); }
        if (e.key === "Escape") { label.textContent = tier.name; label.blur(); }
      });
      label.addEventListener("blur", () => {
        const value = label.textContent.trim().slice(0, 12);
        if (value) { tier.name = value; save(); }
        label.textContent = tier.name;
        label.classList.toggle("long", tier.name.length > 3);
      });

      const zone = el("div", "zone");
      zone.dataset.zone = tier.id;
      tier.items.forEach(id => zone.appendChild(makeCard(id)));
      bindZone(zone);

      const del = el("button", "del");
      del.textContent = "×";
      del.title = "등급 삭제 (영화는 미분류로 돌아갑니다)";
      del.addEventListener("click", () => deleteTier(tier.id));

      row.append(label, zone, del);
      tiersEl.appendChild(row);
    });

    const pool = $("#poolZone");
    pool.innerHTML = "";
    state.pool.forEach(id => pool.appendChild(makeCard(id)));
    if (!state.pool.length) {
      const empty = el("span", "empty");
      empty.textContent = "모든 영화를 분류했어요";
      pool.appendChild(empty);
    }

    $("#addTier").disabled = state.tiers.length >= MAX_TIERS;
    $("#addTier").title = state.tiers.length >= MAX_TIERS ? `등급은 최대 ${MAX_TIERS}개까지` : "";
    sizeCards();
  }

  // 노트북 한 화면에 모두 들어가도록 카드 크기를 맞춤
  function sizeCards() {
    const n = Math.max(state.tiers.length, 1);
    const avail = window.innerHeight - 52 - 14 - 10 - 2 - 2;
    const h = Math.floor((avail - 14 - 12 * n) / (n + 1));
    document.documentElement.style.setProperty("--card-h", Math.max(46, Math.min(110, h)) + "px");
  }

  function makeCard(id) {
    const m = MOVIE[id];
    const card = el("div", "card");
    card.dataset.id = id;
    card.draggable = true;
    card.style.setProperty("--g", m.g);
    card.style.setProperty("--a", m.a);
    card.style.setProperty("--cx", m.cx);
    card.style.setProperty("--cy", m.cy);
    const span = el("span");
    span.textContent = m.title;
    card.appendChild(span);

    card.addEventListener("dragstart", e => {
      dragId = id;
      e.dataTransfer.setData("text/plain", id);
      e.dataTransfer.effectAllowed = "move";
      hideTip();
      closeMenu();
      setTimeout(() => card.classList.add("dragging"), 0);
    });
    card.addEventListener("dragend", () => {
      dragId = null;
      card.classList.remove("dragging");
      clearMarkers();
    });
    card.addEventListener("click", e => { e.stopPropagation(); openMenu(id, card); });
    card.addEventListener("mouseenter", () => { if (!dragId) showTip(m, card); });
    card.addEventListener("mouseleave", hideTip);
    return card;
  }

  // ── 드래그 앤 드롭 ─────────────────────────────────────
  let dragId = null;

  function insertIndex(zone, x, y) {
    const cards = [...zone.querySelectorAll(".card:not(.dragging)")];
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      if (y < r.top) return i;
      if (y <= r.bottom && x < r.left + r.width / 2) return i;
    }
    return cards.length;
  }
  function clearMarkers() {
    document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
    document.querySelectorAll(".card.before").forEach(c => c.classList.remove("before"));
  }
  function bindZone(zone) {
    zone.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      clearMarkers();
      zone.classList.add("over");
      const cards = [...zone.querySelectorAll(".card:not(.dragging)")];
      const idx = insertIndex(zone, e.clientX, e.clientY);
      if (cards[idx]) cards[idx].classList.add("before");
    });
    zone.addEventListener("dragleave", e => {
      if (!zone.contains(e.relatedTarget)) clearMarkers();
    });
    zone.addEventListener("drop", e => {
      if (!dragId) return;
      e.preventDefault();
      const idx = insertIndex(zone, e.clientX, e.clientY);
      const id = dragId;
      dragId = null;
      moveMovie(id, zone.dataset.zone, idx);
    });
  }
  bindZone($("#poolZone"));

  // ── 클릭해서 옮기기 ───────────────────────────────────
  const menu = $("#menu");
  function openMenu(movieId, card) {
    closeMenu();
    hideTip();
    card.classList.add("selected");
    const current = zoneOf(movieId);
    menu.innerHTML = "";
    const title = el("div", "title");
    title.textContent = "어디로 옮길까요?";
    menu.appendChild(title);

    const options = [...state.tiers.map(t => ({ id: t.id, name: t.name })), { id: "pool", name: "미분류" }];
    options.forEach(opt => {
      const b = el("button", opt.id === current ? "current" : "");
      b.textContent = opt.id === current ? `${opt.name} (현재)` : opt.name;
      b.addEventListener("click", e => {
        e.stopPropagation();
        if (opt.id === current) { closeMenu(); return; }
        moveMovie(movieId, opt.id, Infinity);
      });
      menu.appendChild(b);
    });

    menu.style.display = "block";
    const r = card.getBoundingClientRect();
    const mh = menu.offsetHeight, mw = menu.offsetWidth;
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    let left = Math.min(r.left, window.innerWidth - mw - 8);
    menu.style.top = top + "px";
    menu.style.left = left + "px";
  }
  function closeMenu() {
    menu.style.display = "none";
    document.querySelectorAll(".card.selected").forEach(c => c.classList.remove("selected"));
  }
  document.addEventListener("click", e => { if (!menu.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

  // ── 마우스 올리면 정보 ────────────────────────────────
  const tip = $("#tip");
  function showTip(m, card) {
    if (menu.style.display === "block") return;
    tip.innerHTML = "";
    const b = el("b"); b.textContent = m.title;
    const y = el("div"); y.innerHTML = '<span class="muted">개봉</span> '; y.append(m.year + "년");
    const d = el("div"); d.innerHTML = '<span class="muted">감독</span> '; d.append(m.director);
    tip.append(b, y, d);
    tip.style.display = "block";
    const r = card.getBoundingClientRect();
    let left = r.right + 10;
    if (left + tip.offsetWidth > window.innerWidth - 8) left = r.left - tip.offsetWidth - 10;
    let top = Math.min(r.top, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = left + "px";
    tip.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { tip.style.display = "none"; }

  // ── 시작 ──────────────────────────────────────────────
  $("#addTier").addEventListener("click", addTier);
  $("#reset").addEventListener("click", resetAll);
  window.addEventListener("resize", sizeCards);
  render();
</script>
</body>
</html>
