<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동 간격 마인드맵</title>
<style>
/* Layout: 상단 도구 막대 + 전체 화면 캔버스(점 격자) + 하단 단축키 안내 */
:root{
  --bg:#f3f4f7; --dot:#d6d9e1; --panel:#ffffff; --panel-line:#e1e4eb;
  --ink:#1e2330; --muted:#5b6274; --accent:#2f5fd0; --btn-hover:#eef1f7;
  --root-bg:#2c3753; --root-ink:#ffffff; --node-ink:#333333; --match:#d98e04;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161b; --dot:#272b34; --panel:#1c1f26; --panel-line:#2d323c;
    --ink:#e6e8ee; --muted:#9aa1b1; --accent:#86a8ff; --btn-hover:#262a33;
    --root-bg:#45557d; --match:#f2b84b; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);overflow:hidden}
 
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--panel-line);z-index:2}
header h1{font-size:15px;font-weight:700;margin:0 6px 0 0;letter-spacing:-.01em;white-space:nowrap}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:22px;background:var(--panel-line)}
button.b{font:500 13px/1 var(--font);color:var(--ink);background:transparent;border:1px solid var(--panel-line);border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button.b:hover:not(:disabled){background:var(--btn-hover)}
button.b:disabled{opacity:.4;cursor:default}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
button.b:focus-visible,input:focus-visible,.tg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--panel-line);border-radius:7px;padding:0 8px;background:var(--bg)}
.search input{border:0;background:transparent;color:var(--ink);font:13px var(--font);padding:7px 0;width:150px;outline:none}
.search .cnt{font:12px var(--mono);color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
 
#stage{position:relative;flex:1;overflow:hidden;cursor:grab;
  background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.6px);background-size:24px 24px}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
 
.node{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;width:max-content;max-width:240px;
  padding:8px 12px;border-radius:10px;color:var(--node-ink);font:14px/1.4 var(--font);
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;cursor:pointer;user-select:none;
  box-shadow:0 1px 2px rgba(20,25,40,.10),0 2px 8px rgba(20,25,40,.06)}
.node .t{min-width:1ch;outline:none}
.node.root{background:var(--root-bg);color:var(--root-ink);font-size:16px;font-weight:700;padding:12px 18px;border-radius:14px}
.node.sel{outline:2.5px solid var(--accent);outline-offset:3px}
.node.editing{outline:2.5px dashed var(--accent);outline-offset:3px;cursor:text}
.node.editing .t{user-select:text;-webkit-user-select:text}
.node.match{box-shadow:0 0 0 3px var(--match)}
.node.match.cur{box-shadow:0 0 0 3px var(--match),0 0 0 7px color-mix(in srgb,var(--match) 35%,transparent)}
.tg{flex:none;align-self:center;border:0;border-radius:999px;background:rgba(0,0,0,.09);color:inherit;
  font:700 11px/20px var(--mono);height:20px;min-width:20px;padding:0 6px;cursor:pointer;white-space:nowrap}
.tg:hover{background:rgba(0,0,0,.16)}
.root .tg{background:rgba(255,255,255,.2)}
.root .tg:hover{background:rgba(255,255,255,.3)}
 
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:6px 14px;
  background:var(--panel);border-top:1px solid var(--panel-line);color:var(--muted);font-size:12px;z-index:2}
footer .keys{display:flex;flex-wrap:wrap;gap:4px 14px}
kbd{font:11px var(--mono);border:1px solid var(--panel-line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink);background:var(--bg)}
#zoom{font:12px var(--mono);font-variant-numeric:tabular-nums}
 
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>자동 간격 마인드맵</h1>
  <div class="grp">
    <button class="b primary" id="btnChild" title="선택한 노드에 자식 추가 (Tab)">+ 자식</button>
    <button class="b" id="btnSibling" title="형제 노드 추가 (Enter)">형제</button>
    <button class="b" id="btnDelete" title="선택한 노드와 하위 노드 삭제 (Delete)">삭제</button>
  </div>
  <span class="sep"></span>
  <div class="grp">
    <button class="b" id="btnUndo" title="실행 취소 (Ctrl+Z)">실행 취소</button>
    <button class="b" id="btnRedo" title="다시 실행 (Ctrl+Y)">다시 실행</button>
  </div>
  <span class="sep"></span>
  <button class="b" id="btnCenter" title="중심 노드를 화면 가운데로">가운데로</button>
  <label class="search" title="Enter: 다음 결과 · Shift+Enter: 이전 결과">
    <input id="q" type="search" placeholder="노드 검색" autocomplete="off" aria-label="노드 글자 검색">
    <span class="cnt" id="qcnt"></span>
  </label>
  <span class="sep"></span>
  <div class="grp">
    <button class="b" id="btnPng">PNG 저장</button>
    <button class="b" id="btnExport">JSON 내보내기</button>
    <button class="b" id="btnImport">JSON 불러오기</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>
 
<div id="stage">
  <div id="world">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>
 
<footer>
  <div class="keys">
    <span>클릭 선택</span>
    <span><kbd>Tab</kbd> 자식</span>
    <span><kbd>Enter</kbd> 형제</span>
    <span>더블클릭 · <kbd>F2</kbd> 수정</span>
    <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈</span>
    <span><kbd>Esc</kbd> 수정 취소</span>
    <span><kbd>Delete</kbd> 삭제</span>
    <span>빈 곳 끌기 이동 · 휠 확대/축소</span>
  </div>
  <span id="zoom">100%</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
 
<script>
(() => {
'use strict';
 
/* ---------- 상수 ---------- */
const KEY = 'auto-spacing-mindmap/v1';
const NODE_BG   = Array.from({length:10}, (_, i) => `hsl(${i*36}, 60%, 85%)`); // 깊이 1~10
const EDGE_COL  = Array.from({length:10}, (_, i) => `hsl(${i*36}, 42%, 60%)`);
const GAP = 40;      // 깊이 고리 사이 최소 빈 공간(px)
const PAD = 10;      // 같은 깊이 이웃 노드 사이 여유(px, 양쪽 합 20)
const ANIM_MS = 340;
const TWO_PI = Math.PI * 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
 
/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), world = $('world'), svg = $('edges');
const q = $('q'), qcnt = $('qcnt');
 
/* ---------- 상태 ---------- */
let root, sel, nextId = 1;
const byId = new Map(), parentOf = new Map();
const els = new Map();        // id -> {el, t, tg, w, h}
const edgeEls = new Map();    // childId -> <path>
let cur = new Map();          // 현재 화면에 그려진 극좌표 상태
let targetLayout = new Map(); // 최종 배치
let animId = 0, firstRender = true;
let editing = null, lastEditEnd = -Infinity, pendingCommit = false;
const undoStack = [], redoStack = [];
const view = {x:0, y:0, k:1};
let matchIdx = -1, saveWarned = false;
 
const mk = text => ({id: 'n' + (nextId++), text, collapsed: false, children: []});
 
function index(){
  byId.clear(); parentOf.clear();
  (function walk(n, p){ byId.set(n.id, n); parentOf.set(n.id, p); n.children.forEach(c => walk(c, n)); })(root, null);
}
const kids = n => n.collapsed ? [] : n.children;
function countDesc(n){ let c = 0; for (const k of n.children) c += 1 + countDesc(k); return c; }
function visibleList(){
  const out = [];
  (function walk(n, d){ out.push({n, d}); kids(n).forEach(c => walk(c, d + 1)); })(root, 0);
  return out;
}
 
/* ---------- 저장 / 불러오기 ---------- */
const strip = n => ({text: n.text, collapsed: !!n.collapsed, children: n.children.map(strip)});
function build(o, depth){
  if (!o || typeof o !== 'object' || typeof o.text !== 'string') throw new Error('노드에 text 문자열이 없습니다.');
  if (o.children !== undefined && !Array.isArray(o.children)) throw new Error('children은 배열이어야 합니다.');
  if (depth > 500) throw new Error('트리가 너무 깊습니다.');
  const n = mk(o.text);
  n.collapsed = !!o.collapsed;
  n.children = (o.children || []).map(c => build(c, depth + 1));
  return n;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({app:'auto-spacing-mindmap', version:1, root:strip(root)})); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast('브라우저 저장소를 쓸 수 없어 자동 저장이 되지 않습니다. JSON 내보내기를 이용하세요.'); }
  }
}
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) { root = build(JSON.parse(s).root, 0); return; }
  } catch (e) { /* 손상된 저장본은 무시 */ }
  root = mk('중심 주제');
}
 
/* ---------- 실행 취소 ---------- */
const snapshot = () => JSON.stringify({root, sel});
function record(){
  undoStack.push(snapshot());
  if (undoStack.length > 200) undoStack.shift();
  redoStack.length = 0;
}
function restore(s){ const o = JSON.parse(s); root = o.root; index(); sel = byId.has(o.sel) ? o.sel : root.id; }
function undo(){ if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); changed(); }
function redo(){ if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); changed(); }
function changed(){ save(); render(); }
 
/* ---------- 렌더링 ---------- */
function render(){
  index();
  if (!byId.has(sel)) sel = root.id;
  // 접힌 조상 아래로 숨은 노드가 선택돼 있으면 가장 바깥 접힌 조상을 선택
  { let s = byId.get(sel), p = parentOf.get(sel); while (p) { if (p.collapsed) s = p; p = parentOf.get(p.id); } sel = s.id; }
 
  const vis = visibleList();
  const seen = new Set();
  const matches = new Set(matchList());
  const curMatch = matchIdx >= 0 ? matchList()[matchIdx] : null;
 
  for (const {n, d} of vis){
    seen.add(n.id);
    let rec = els.get(n.id);
    if (!rec) rec = createNodeEl(n.id);
    const {el, t, tg} = rec;
    if (!(editing && editing.id === n.id) && t.textContent !== n.text) t.textContent = n.text;
    el.classList.toggle('root', d === 0);
    el.style.background = d === 0 ? '' : NODE_BG[(d - 1) % 10];
    el.dataset.depth = d;
    el.classList.toggle('sel', n.id === sel);
    el.classList.toggle('match', matches.has(n.id));
    el.classList.toggle('cur', n.id === curMatch);
    el.setAttribute('aria-label', `깊이 ${d}: ${n.text}`);
    if (n.children.length){
      tg.hidden = false;
      tg.textContent = n.collapsed ? '+' + countDesc(n) : '−';
      tg.title = n.collapsed ? `펼치기 (숨긴 노드 ${countDesc(n)}개)` : '접기';
      tg.setAttribute('aria-label', tg.title);
    } else tg.hidden = true;
  }
  for (const [id, rec] of els) if (!seen.has(id)) { rec.el.remove(); els.delete(id); }
 
  // 가장자리 경로 요소 동기화
  for (const {n, d} of vis){
    if (d === 0) continue;
    let p = edgeEls.get(n.id);
    if (!p){ p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); svg.appendChild(p); edgeEls.set(n.id, p); }
    p.setAttribute('stroke', EDGE_COL[(d - 1) % 10]);
    p.dataset.from = parentOf.get(n.id).id; p.dataset.to = n.id;
  }
  for (const [id, p] of edgeEls) if (!seen.has(id) || id === root.id) { p.remove(); edgeEls.delete(id); }
 
  // 크기 측정 (월드 확대와 무관한 offset 크기)
  for (const {n} of vis){ const r = els.get(n.id); r.w = r.el.offsetWidth; r.h = r.el.offsetHeight; }
 
  animateTo(computeLayout(vis), firstRender);
  firstRender = false;
  ensureVisible(sel);   // 재배치 후에도 최근 선택(포커스)된 노드가 화면 안에 남도록
  updateUi();
}
 
function createNodeEl(id){
  const el = document.createElement('div');
  el.className = 'node'; el.dataset.id = id;
  const t = document.createElement('span'); t.className = 't';
  const tg = document.createElement('button'); tg.className = 'tg'; tg.type = 'button'; tg.hidden = true;
  el.append(t, tg);
  world.appendChild(el);
 
  el.addEventListener('click', e => {
    if (e.target === tg) return;
    if (editing && editing.id === id) return;
    sel = id; updateSelClass();
  });
  el.addEventListener('dblclick', e => { if (e.target !== tg) startEdit(id); });
  tg.addEventListener('mousedown', e => e.stopPropagation());
  tg.addEventListener('click', e => { e.stopPropagation(); act(() => toggleCollapse(id)); });
 
  t.addEventListener('keydown', e => {
    if (!editing || editing.id !== id) return;
    e.stopPropagation();
    if (e.isComposing || e.keyCode === 229){   // 한글 조합 중 Enter는 조합 완료 후 처리
      if (e.key === 'Enter' && !e.shiftKey) pendingCommit = true;
      return;
    }
    if (e.key === 'Enter' && e.shiftKey){ e.preventDefault(); document.execCommand('insertLineBreak'); render(); }
    else if (e.key === 'Enter'){ e.preventDefault(); finishEdit(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finishEdit(false); }
    else if (e.key === 'Tab'){ e.preventDefault(); finishEdit(true); addChild(); }
  });
  t.addEventListener('compositionend', () => {
    if (pendingCommit){ setTimeout(() => { if (editing && editing.id === id){ pendingCommit = true; finishEdit(true); } }, 0); }
  });
  t.addEventListener('input', () => { if (editing && editing.id === id) render(); });
  t.addEventListener('blur', () => { if (editing && editing.id === id) finishEdit(true); });
  t.addEventListener('paste', e => {   // 서식 없는 글자만 붙여넣기
    if (!editing) return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\r/g, ''));
  });
 
  const rec = {el, t, tg, w: 0, h: 0};
  els.set(id, rec);
  return rec;
}
 
function updateSelClass(){ for (const [id, r] of els) r.el.classList.toggle('sel', id === sel); updateUi(); }
 
/* ---------- 방사형 자동 배치 ----------
   1) 노드마다 반대각선 길이 s(외접원 반지름 + 여유)를 구한다.
   2) 깊이별 고리 반지름 R[d] = R[d-1] + maxS[d-1] + GAP + maxS[d]  → 다른 깊이끼리 안 겹침
   3) 각 노드는 자기 외접원이 들어갈 최소 부채꼴 각 a = 2·asin(s/r)가 필요.
      서브트리 필요각 A = max(a, Σ자식 A). 합이 360°를 넘으면 모든 고리를 같은 비율로 키운다.
   4) 부채꼴을 필요각 비율로 나눠 준다 → 서로 다른 부채꼴의 노드는 절대 겹치지 않음.
   5) 연결선은 부모 방향으로 곧게 나가 고리 사이 빈 공간에서만 휘고, 자식 방향으로 곧게 들어간다. */
function computeLayout(vis){
  const info = new Map(), maxS = [];
  for (const {n, d} of vis){
    const r = els.get(n.id);
    const s = Math.hypot(r.w, r.h) / 2 + PAD;
    info.set(n.id, {d, s});
    maxS[d] = Math.max(maxS[d] || 0, s);
  }
  const R = [0];
  for (let d = 1; d < maxS.length; d++) R[d] = R[d - 1] + maxS[d - 1] + GAP + maxS[d];
 
  const A = new Map();
  const need = f => {
    (function walk(n, d){
      let sum = 0;
      for (const c of kids(n)) sum += walk(c, d + 1);
      const a = d === 0 ? 0 : 2 * Math.asin(Math.min(1, info.get(n.id).s / (R[d] * f)));
      const v = Math.max(a, sum);
      A.set(n.id, v);
      return v;
    })(root, 0);
    return A.get(root.id);
  };
  let f = 1;
  if (need(1) > TWO_PI){
    let lo = 1, hi = 2;
    while (need(hi) > TWO_PI && hi < 1e6) { lo = hi; hi *= 2; }
    for (let i = 0; i < 30; i++){ const m = (lo + hi) / 2; if (need(m) > TWO_PI) lo = m; else hi = m; }
    f = hi;
  }
  const total = need(f);
 
  const out = new Map();
  out.set(root.id, {r: 0, th: 0, rin: 0, rout: maxS[0]});
  const place = (n, d, start, W) => {
    const ch = kids(n);
    if (!ch.length) return;
    const sumA = ch.reduce((s, c) => s + A.get(c.id), 0) || 1;
    let a = start;
    for (const c of ch){
      const Wc = W * A.get(c.id) / sumA;
      const r = R[d + 1] * f;
      out.set(c.id, {r, th: a + Wc / 2, rin: r - maxS[d + 1], rout: r + maxS[d + 1]});
      place(c, d + 1, a, Wc);
      a += Wc;
    }
  };
  const ch0 = kids(root);
  if (ch0.length){
    const firstW = TWO_PI * A.get(ch0[0].id) / total;
    place(root, 0, -Math.PI / 2 - firstW / 2, TWO_PI);   // 첫 자식이 위쪽, 시계 방향
  }
  return out;
}
 
const norm = a => { a = (a + Math.PI) % TWO_PI; if (a < 0) a += TWO_PI; return a - Math.PI; };
const lerp = (a, b, t) => a + (b - a) * t;
 
function edgePoints(P, C){
  const pts = [];
  const pol = (r, th) => pts.push([r * Math.cos(th), r * Math.sin(th)]);
  if (P.r < 1e-6){ pts.push([0, 0]); pol(C.r, C.th); return pts; }
  const dth = norm(C.th - P.th);
  let a = Math.max(P.rout, P.r), b = Math.min(C.rin, C.r);
  if (b <= a){ const m = (P.r + C.r) / 2; a = m - 0.5; b = m + 0.5; }
  pol(P.r, P.th);
  const N = Math.max(8, Math.ceil(Math.abs(dth) * b / 6));
  for (let i = 0; i <= N; i++){
    const u = i / N, s = u * u * (3 - 2 * u);
    pol(lerp(a, b, u), P.th + dth * s);
  }
  pol(C.r, C.th);
  return pts;
}
 
function animateTo(target, instant){
  const from = new Map();
  for (const id of target.keys()){
    let c = cur.get(id);
    if (!c){
      let a = parentOf.get(id);
      while (a && !cur.get(a.id)) a = parentOf.get(a.id);
      c = a ? cur.get(a.id) : target.get(id);
    }
    from.set(id, {...c});
  }
  targetLayout = target;
  cancelAnimationFrame(animId);
  if (instant || reduceMotion.matches){ cur = new Map(target); draw(cur); return; }
  cur = from; draw(cur);   // 새 노드를 첫 프레임부터 부모 위치에 둠 (원점에 잠깐 놓이는 문제 방지)
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ANIM_MS), e = 1 - Math.pow(1 - p, 3);
    const m = new Map();
    for (const [id, t] of target){
      const f = from.get(id);
      m.set(id, {r: lerp(f.r, t.r, e), th: f.th + norm(t.th - f.th) * e, rin: lerp(f.rin, t.rin, e), rout: lerp(f.rout, t.rout, e)});
    }
    cur = p < 1 ? m : new Map(target);
    draw(cur);
    if (p < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
 
function draw(m){
  for (const [id, s] of m){
    const r = els.get(id); if (!r) continue;
    const x = s.r * Math.cos(s.th), y = s.r * Math.sin(s.th);
    r.el.style.transform = `translate(${(x - r.w / 2).toFixed(2)}px, ${(y - r.h / 2).toFixed(2)}px)`;
  }
  for (const [id, path] of edgeEls){
    const p = parentOf.get(id);
    const P = p && m.get(p.id), C = m.get(id);
    if (!P || !C) continue;
    path.setAttribute('d', edgePoints(P, C).map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(''));
  }
}
 
/* ---------- 화면 이동 / 확대 ---------- */
function applyView(){
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  const g = 24 * view.k;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  $('zoom').textContent = Math.round(view.k * 100) + '%';
}
let viewAnim = 0;
function panTo(wx, wy){   // 월드 좌표 (wx, wy)를 화면 가운데로
  const tx = stage.clientWidth / 2 - wx * view.k, ty = stage.clientHeight / 2 - wy * view.k;
  cancelAnimationFrame(viewAnim);
  if (reduceMotion.matches){ view.x = tx; view.y = ty; applyView(); return; }
  const sx = view.x, sy = view.y, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / 300), e = 1 - Math.pow(1 - p, 3);
    view.x = lerp(sx, tx, e); view.y = lerp(sy, ty, e); applyView();
    if (p < 1) viewAnim = requestAnimationFrame(step);
  };
  viewAnim = requestAnimationFrame(step);
}
const worldPos = id => { const s = targetLayout.get(id); return s ? [s.r * Math.cos(s.th), s.r * Math.sin(s.th)] : [0, 0]; };
function ensureVisible(id){
  const [wx, wy] = worldPos(id), r = els.get(id);
  const sx = view.x + wx * view.k, sy = view.y + wy * view.k;
  const mx = (r ? r.w : 0) * view.k / 2 + 40, my = (r ? r.h : 0) * view.k / 2 + 40;
  if (sx < mx || sy < my || sx > stage.clientWidth - mx || sy > stage.clientHeight - my) panTo(wx, wy);
}
 
// 화면 이동은 view 변환으로만 한다. 포커스·선택 등으로 #stage가 스크롤되면 즉시 되돌린다.
stage.addEventListener('scroll', () => { if (stage.scrollLeft || stage.scrollTop){ stage.scrollLeft = 0; stage.scrollTop = 0; } });
 
let pan = null;
stage.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('.node')) return;
  if (editing) finishEdit(true);
  e.preventDefault();
  cancelAnimationFrame(viewAnim);
  pan = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y};
  stage.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  view.x = pan.vx + e.clientX - pan.x; view.y = pan.vy + e.clientY - pan.y; applyView();
});
window.addEventListener('mouseup', () => { pan = null; stage.classList.remove('panning'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  cancelAnimationFrame(viewAnim);
  const rect = stage.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  const k = Math.min(3, Math.max(0.2, view.k * Math.exp(-dy * 0.0015)));
  view.x = px - (px - view.x) * k / view.k;
  view.y = py - (py - view.y) * k / view.k;
  view.k = k; applyView();
}, {passive: false});
 
/* ---------- 글자 수정 ---------- */
function startEdit(id, isNew = false){
  if (editing) finishEdit(true);
  const rec = els.get(id); if (!rec) return;
  sel = id; updateSelClass();
  editing = {id, before: byId.get(id).text, isNew};
  pendingCommit = false;
  rec.el.classList.add('editing');
  const t = rec.t;
  try { t.contentEditable = 'plaintext-only'; } catch (_) {}
  if (t.contentEditable !== 'plaintext-only') t.contentEditable = 'true';
  t.focus({preventScroll: true});   // 브라우저가 #stage를 스크롤해 화면이 튀지 않도록
  const range = document.createRange(); range.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(range);
  ensureVisible(id);
}
function finishEdit(commit){
  if (!editing) return;
  const {id, before, isNew} = editing;
  if (pendingCommit) lastEditEnd = performance.now();
  editing = null; pendingCommit = false;
  const rec = els.get(id), n = byId.get(id);
  let text = before;
  if (rec){
    if (commit){
      text = rec.t.innerText.replace(/\r/g, '').replace(/ /g, ' ').replace(/\s+$/, '');
      if (!text.trim()) text = before;
    }
    rec.t.contentEditable = 'false';
    rec.el.classList.remove('editing');
    getSelection().removeAllRanges();
    rec.t.blur();
    rec.t.textContent = text;
  }
  if (n && text !== n.text){ if (!isNew) record(); n.text = text; }
  save(); render();
}
 
/* ---------- 노드 조작 ---------- */
function act(fn){ if (editing) finishEdit(true); fn(); }
function addChild(){
  const p = byId.get(sel); if (!p) return;
  record();
  const n = mk('새 주제');
  p.children.push(n); p.collapsed = false; sel = n.id;
  changed(); startEdit(n.id, true);
}
function addSibling(){
  const s = byId.get(sel), p = parentOf.get(sel);
  if (!p){ toast('중심 노드에는 형제를 추가할 수 없습니다. Tab으로 자식을 추가하세요.'); return; }
  record();
  const n = mk('새 주제');
  p.children.splice(p.children.indexOf(s) + 1, 0, n); sel = n.id;
  changed(); startEdit(n.id, true);
}
function removeSel(){
  const s = byId.get(sel), p = parentOf.get(sel);
  if (!p){ toast('중심 노드는 삭제할 수 없습니다.'); return; }
  record();
  const i = p.children.indexOf(s);
  p.children.splice(i, 1);
  sel = (p.children[i] || p.children[i - 1] || p).id;
  changed();
}
function toggleCollapse(id){
  const n = byId.get(id); if (!n || !n.children.length) return;
  record(); n.collapsed = !n.collapsed; sel = id; changed();
}
 
/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  if (editing) return;
  const inField = e.target instanceof Element && e.target.closest('input, textarea, [contenteditable="true"], [contenteditable="plaintext-only"]');
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z' && !inField){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y' && !inField){ e.preventDefault(); redo(); return; }
  if (mod && k === 'f'){ e.preventDefault(); q.focus(); q.select(); return; }
  if (inField || mod || e.altKey) return;
  if (e.target instanceof HTMLButtonElement && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === 'Tab'){ e.preventDefault(); addChild(); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    if (performance.now() - lastEditEnd < 150) return;  // 한글 입력 완료 직후 중복 Enter 무시
    addSibling();
  }
  else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); removeSel(); }
  else if (e.key === 'F2'){ e.preventDefault(); startEdit(sel); }
});
 
/* ---------- 검색 ---------- */
function matchList(){
  const s = q.value.trim().toLowerCase(); if (!s) return [];
  const out = [];
  (function walk(n){ if (n.text.toLowerCase().includes(s)) out.push(n.id); n.children.forEach(walk); })(root);
  return out;
}
function gotoMatch(dir){
  const list = matchList(); if (!list.length) return;
  matchIdx = ((matchIdx < 0 && dir < 0 ? 0 : matchIdx) + dir + list.length) % list.length;
  const id = list[matchIdx];
  let p = parentOf.get(id), opened = false;
  while (p){ if (p.collapsed){ p.collapsed = false; opened = true; } p = parentOf.get(p.id); }
  sel = id;
  if (opened) save();
  render();
  const [wx, wy] = worldPos(id); panTo(wx, wy);
}
q.addEventListener('input', () => { matchIdx = -1; render(); });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); if (!e.isComposing) gotoMatch(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape'){ q.value = ''; matchIdx = -1; q.blur(); render(); }
});
 
/* ---------- 내보내기 / 불러오기 ---------- */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileBase = () => (root.text.split('\n')[0].replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 40) || '마인드맵');
function exportJson(){
  const data = {app:'auto-spacing-mindmap', version:1, savedAt:new Date().toISOString(), root:strip(root)};
  download(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}), fileBase() + '.json');
  toast('JSON 파일로 내보냈습니다.');
}
function importJson(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      const newRoot = build(data && data.root ? data.root : data, 0);
      record(); root = newRoot; sel = root.id; cur = new Map(); firstRender = true;
      changed(); panTo(0, 0);
      toast('마인드맵을 불러왔습니다.');
    } catch (err) {
      toast('불러오지 못했습니다. 이 앱에서 내보낸 JSON 파일인지 확인하세요. (' + err.message + ')');
    }
  };
  fr.onerror = () => toast('파일을 읽지 못했습니다.');
  fr.readAsText(file);
}
 
function textLines(t){
  const tn = t.firstChild;
  if (!tn || tn.nodeType !== 3) return [t.textContent];
  const s = tn.data, lines = [], rg = document.createRange();
  let line = '', top = null;
  for (let i = 0; i < s.length;){
    const ch = String.fromCodePoint(s.codePointAt(i)), len = ch.length;
    if (ch === '\n'){ lines.push(line); line = ''; top = null; i += len; continue; }
    rg.setStart(tn, i); rg.setEnd(tn, i + len);
    const rects = rg.getClientRects();
    const rt = rects.length ? rects[0].top : top;
    if (top !== null && rt !== null && Math.abs(rt - top) > 2 && line){ lines.push(line); line = ''; }
    top = rt; line += ch; i += len;
  }
  lines.push(line);
  return lines.map(l => l.replace(/\s+$/, ''));
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function exportPng(){
  const vis = visibleList();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const {n} of vis){
    const [x, y] = worldPos(n.id), r = els.get(n.id);
    minX = Math.min(minX, x - r.w / 2); maxX = Math.max(maxX, x + r.w / 2);
    minY = Math.min(minY, y - r.h / 2); maxY = Math.max(maxY, y + r.h / 2);
  }
  const pad = 48, scale = 2;
  const W = Math.ceil(maxX - minX + pad * 2), H = Math.ceil(maxY - minY + pad * 2);
  if (W * H * scale * scale > 16384 * 16384 / 2){ toast('마인드맵이 너무 커서 이미지로 저장할 수 없습니다.'); return; }
  const cv = document.createElement('canvas'); cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  ctx.scale(scale, scale);
  ctx.fillStyle = css.getPropertyValue('--bg').trim() || '#f3f4f7';
  ctx.fillRect(0, 0, W, H);
  ctx.translate(pad - minX, pad - minY);
 
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [id, path] of edgeEls){
    const p = parentOf.get(id), P = targetLayout.get(p.id), C = targetLayout.get(id);
    if (!P || !C) continue;
    ctx.strokeStyle = path.getAttribute('stroke');
    ctx.beginPath();
    edgePoints(P, C).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
  }
  for (const {n, d} of vis){
    const rec = els.get(n.id), [cx, cy] = worldPos(n.id);
    const x = cx - rec.w / 2, y = cy - rec.h / 2;
    const cs = getComputedStyle(rec.el);
    ctx.fillStyle = cs.backgroundColor;
    roundRect(ctx, x, y, rec.w, rec.h, parseFloat(cs.borderTopLeftRadius) || 10); ctx.fill();
    const ts = getComputedStyle(rec.t);
    ctx.fillStyle = ts.color;
    ctx.font = `${ts.fontWeight} ${ts.fontSize} ${ts.fontFamily}`;
    ctx.textBaseline = 'middle';
    const lh = parseFloat(ts.lineHeight) || parseFloat(ts.fontSize) * 1.4;
    textLines(rec.t).forEach((line, i) => ctx.fillText(line, x + rec.t.offsetLeft, y + rec.t.offsetTop + lh * i + lh / 2));
    if (!rec.tg.hidden){
      const b = rec.tg;
      ctx.fillStyle = d === 0 ? 'rgba(255,255,255,.2)' : 'rgba(0,0,0,.09)';
      roundRect(ctx, x + b.offsetLeft, y + b.offsetTop, b.offsetWidth, b.offsetHeight, b.offsetHeight / 2); ctx.fill();
      const bs = getComputedStyle(b);
      ctx.fillStyle = bs.color; ctx.font = `${bs.fontWeight} ${bs.fontSize} ${bs.fontFamily}`; ctx.textAlign = 'center';
      ctx.fillText(b.textContent, x + b.offsetLeft + b.offsetWidth / 2, y + b.offsetTop + b.offsetHeight / 2);
      ctx.textAlign = 'start';
    }
  }
  cv.toBlob(blob => { if (blob){ download(blob, fileBase() + '.png'); toast('PNG 이미지로 저장했습니다.'); } else toast('이미지를 만들지 못했습니다.'); }, 'image/png');
}
 
/* ---------- 도구 막대 ---------- */
let toastTimer = 0;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
function updateUi(){
  $('btnUndo').disabled = !undoStack.length;
  $('btnRedo').disabled = !redoStack.length;
  const isRoot = sel === root.id;
  $('btnSibling').disabled = isRoot;
  $('btnDelete').disabled = isRoot;
  const list = matchList();
  qcnt.textContent = q.value.trim() ? (list.length ? (matchIdx >= 0 ? `${matchIdx + 1}/${list.length}` : `${list.length}개`) : '없음') : '';
}
document.querySelector('header').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
$('btnChild').onclick   = () => act(addChild);
$('btnSibling').onclick = () => act(addSibling);
$('btnDelete').onclick  = () => act(removeSel);
$('btnUndo').onclick    = () => act(undo);
$('btnRedo').onclick    = () => act(redo);
$('btnCenter').onclick  = () => panTo(0, 0);
$('btnExport').onclick  = () => act(exportJson);
$('btnPng').onclick     = () => act(exportPng);
$('btnImport').onclick  = () => { act(() => {}); $('file').click(); };
$('file').onchange = e => { const f = e.target.files[0]; if (f) importJson(f); e.target.value = ''; };
 
/* ---------- 검증 도우미 (개발자 도구 콘솔용) ---------- */
window.checkOverlaps = function(){
  const nodes = [...document.querySelectorAll('.node')];
  const rects = nodes.map(n => n.getBoundingClientRect());
  let nodePairs = 0;
  for (let i = 0; i < rects.length; i++) for (let j = i + 1; j < rects.length; j++){
    const a = rects[i], b = rects[j];
    if (a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom) nodePairs++;
  }
  let edgeHits = 0;
  for (const path of svg.querySelectorAll('path')){
    const ctm = path.getScreenCTM(), L = path.getTotalLength();
    const skip = new Set([path.dataset.from, path.dataset.to]);
    const others = nodes.map((n, i) => [n.dataset.id, rects[i]]).filter(([id]) => !skip.has(id));
    for (let l = 0; l <= L; l += 3){
      const p = new DOMPoint(path.getPointAtLength(l).x, path.getPointAtLength(l).y).matrixTransform(ctm);
      if (others.some(([, r]) => p.x > r.left && p.x < r.right && p.y > r.top && p.y < r.bottom)){ edgeHits++; break; }
    }
  }
  const res = {노드수: nodes.length, 겹치는노드쌍: nodePairs, 노드를지나는연결선: edgeHits};
  console.table(res);
  return res;
};
window.addTestNodes = function(count = 30){
  record();
  for (let i = 0; i < count; i++){
    const all = [...byId.values()].filter(n => !n.collapsed);
    const p = all[Math.floor(Math.random() * all.length)];
    const words = ['아이디어', '할 일', '참고 자료', '질문', '긴 문장으로 된 노드가 줄바꿈되는 경우', '메모', '다음 단계'];
    p.children.push(mk(words[i % words.length] + ' ' + (i + 1)));
    index();
  }
  changed();
  return '노드 ' + count + '개를 추가했습니다. 애니메이션이 끝난 뒤 checkOverlaps()를 실행하세요.';
};
 
/* ---------- 시작 ---------- */
load();
sel = root.id;
view.x = stage.clientWidth / 2; view.y = stage.clientHeight / 2;
applyView();
render();
window.addEventListener('resize', updateUi);
})();
</script>
</body>
